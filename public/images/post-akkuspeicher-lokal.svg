<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#0d1117"/>

  <!-- Battery / storage unit on the left -->
  <g transform="translate(120, 120)">
    <!-- Battery body -->
    <rect x="0" y="0" width="160" height="130" rx="6" fill="#1c2128" stroke="#3fb950" stroke-width="2"/>
    <!-- Battery cap -->
    <rect x="55" y="-12" width="50" height="12" rx="2" fill="#1c2128" stroke="#3fb950" stroke-width="2"/>
    <!-- Charge bars -->
    <rect x="20" y="20" width="120" height="18" rx="2" fill="#3fb950" opacity="0.9"/>
    <rect x="20" y="44" width="100" height="18" rx="2" fill="#3fb950" opacity="0.7"/>
    <rect x="20" y="68" width="70" height="18" rx="2" fill="#3fb950" opacity="0.5"/>
    <rect x="20" y="92" width="40" height="18" rx="2" fill="#3fb950" opacity="0.3"/>
    <!-- Label -->
    <text x="80" y="125" text-anchor="middle" fill="#3fb950" font-family="sans-serif" font-size="13" font-weight="bold">Heimspeicher</text>
  </g>

  <!-- Local protocols (right side) -->
  <g transform="translate(500, 110)">
    <!-- Modbus TCP -->
    <rect x="0" y="0" width="180" height="36" rx="4" fill="#1c2128" stroke="#58a6ff" stroke-width="2"/>
    <text x="90" y="24" text-anchor="middle" fill="#58a6ff" font-family="sans-serif" font-size="14" font-weight="bold">Modbus TCP</text>
    <!-- REST -->
    <rect x="0" y="50" width="180" height="36" rx="4" fill="#1c2128" stroke="#bc8cff" stroke-width="2"/>
    <text x="90" y="74" text-anchor="middle" fill="#bc8cff" font-family="sans-serif" font-size="14" font-weight="bold">REST / LAN-IP</text>
    <!-- Home Assistant -->
    <rect x="0" y="100" width="180" height="36" rx="4" fill="#1c2128" stroke="#3fb950" stroke-width="2"/>
    <text x="90" y="124" text-anchor="middle" fill="#3fb950" font-family="sans-serif" font-size="14" font-weight="bold">Home Assistant</text>
  </g>

  <!-- Connection arrows (local, no cloud) -->
  <line x1="285" y1="175" x2="495" y2="130" stroke="#3fb950" stroke-width="2"/>
  <line x1="285" y1="185" x2="495" y2="175" stroke="#3fb950" stroke-width="2"/>
  <line x1="285" y1="195" x2="495" y2="220" stroke="#3fb950" stroke-width="2"/>

  <!-- Cloud crossed out (top right) -->
  <g transform="translate(640, 50)">
    <ellipse cx="0" cy="20" rx="50" ry="28" fill="#1c2128" stroke="#f78166" stroke-width="2" opacity="0.5"/>
    <ellipse cx="-20" cy="5" rx="22" ry="16" fill="#1c2128" stroke="#f78166" stroke-width="2" opacity="0.5"/>
    <line x1="-60" y1="-10" x2="60" y2="50" stroke="#f78166" stroke-width="3"/>
  </g>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#c9d1d9" font-family="sans-serif" font-size="18" font-weight="bold">Akkuspeicher lokal steuerbar: Was die Community sagt</text>

  <!-- Labels on arrows -->
  <text x="390" y="120" text-anchor="middle" fill="#3fb950" font-family="sans-serif" font-size="11">lokal · kein Internet</text>

  <!-- Footer -->
  <text x="400" y="370" text-anchor="middle" fill="#484f58" font-family="sans-serif" font-size="11">Victron · E3DC · Kostal · Zendure — Modbus TCP vs. Cloud-API</text>
</svg>